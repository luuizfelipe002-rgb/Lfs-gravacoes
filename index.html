
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LF$ App</title><style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:16px}input,textarea{width:100%;background:#222;border:1px solid #444;color:#fff;padding:12px;border-radius:12px;margin-top:8px;box-sizing:border-box}button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:900;margin-top:10px}.verde{background:#84ff00;color:#000}.card{background:#111;border:1px solid #333;padding:12px;border-radius:12px;margin-top:10px}</style></head><body>
<div id="home"><h1>LF$ GRAVACOES</h1><button class="verde" onclick="go('cli')">SOU CLIENTE</button><button style="background:#222;color:#84ff00;border:1px solid #84ff00" onclick="go('login')">SOU DONO - PAINEL</button></div>
<div id="cli" style="display:none"><button onclick="go('home')">Voltar</button><h2>ORCAMENTO</h2><input id="n" placeholder="Seu nome"><input id="z" placeholder="Seu WhatsApp"><div style="display:flex;gap:8px;margin-top:10px"><button id="b1" class="verde" onclick="tipo='meu';pre=30;up()">Meu R$30</button><button id="b2" style="background:#222;color:#fff" onclick="tipo='lfs';pre=60;up()">Madeira R$60</button></div><textarea id="m" placeholder="Musicas que voce quer:"></textarea><button class="verde" onclick="env()">ENVIAR WHATSAPP</button><div id="tot" style="text-align:center;color:#84ff00;font-weight:900;margin-top:8px">Total R$30</div></div>
<div id="login" style="display:none"><button onclick="go('home')">Voltar</button><h2 style="color:#84ff00">PAINEL DONO</h2><input id="u" placeholder="admin"><input id="p" type="password" placeholder="LFS2024"><button class="verde" onclick="log()">ENTRAR</button></div>
<div id="painel" style="display:none"><h2 style="color:#84ff00">DASHBOARD</h2><button onclick="go('home')">Sair</button><div id="lista"></div></div>
<script>
let tipo='meu',pre=30;function go(id){['home','cli','login','painel'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display='block';if(id=='painel')show()}
function up(){document.getElementById('tot').innerText='Total R$'+pre;}
function env(){let n=document.getElementById('n').value,z=document.getElementById('z').value,m=document.getElementById('m').value;if(!n||!z){alert('Nome e Zap!');return}let ped={n,z,t:tipo,pre,m,d:new Date().toLocaleString()};let l=JSON.parse(localStorage.getItem('lfs')||'[]');l.unshift(ped);localStorage.setItem('lfs',JSON.stringify(l));let txt=`*ORCAMENTO LF$*%0A${n}%0A${z}%0A${tipo} R$${pre}%0A${m}`;open('https://wa.me/5534996470094?text='+txt)}
function log(){if(document.getElementById('u').value=='admin'&&document.getElementById('p').value=='LFS2024')go('painel');else alert('admin / LFS2024')}
function show(){let l=JSON.parse(localStorage.getItem('lfs')||'[]');let h='';l.forEach(x=>{h+=`<div class=card><b>${x.n}</b> - R$${x.pre}<br>${x.z}<br>${x.t}<br><small>${x.m}</small><br><a href=https://wa.me/55${x.z.replace(/\D/g,'')} style=color:#84ff00>Chamar Zap</a></div>`});document.getElementById('lista').innerHTML=h||'Nenhum ainda'}
</script></body></html>
